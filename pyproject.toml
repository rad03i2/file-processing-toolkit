[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-processing-toolkit"
version = "1.0.0"
description = "Safe, dependency-free file inventory, hashing, duplicate detection, and rename planning tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["files", "hashing", "duplicates", "rename", "cli"]

[project.scripts]
file-toolkit = "file_processing_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
